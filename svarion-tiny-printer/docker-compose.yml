services:
  app_proxy:
    environment:
      APP_HOST: svarion-tiny-printer_server_1
      APP_PORT: 3000
      # Device clients cannot send Umbrel browser-login cookies; the server enforces Bearer auth.
      PROXY_AUTH_WHITELIST: "/api/*,/healthz"

  server:
    image: docker.io/svarion0/tiny-printer:0.8.8@sha256:062cb980b177c3d766b16cf7015ecee3b4bead4e0319afc0c5a9e5329dd63182
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DATA_DIR: /data
      DEVICE_TOKEN: ${APP_SVARION_TINY_PRINTER_DEVICE_TOKEN}
      SHOW_TOKEN_ON_STATUS_PAGE: "true"
