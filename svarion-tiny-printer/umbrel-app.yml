manifestVersion: 1
id: svarion-tiny-printer
storage:
  dataRoot: data
category: automation
name: TinyPrinter
version: "0.8.6"
tagline: Little Printer receipts for your Sunmi V2
icon: https://raw.githubusercontent.com/svarion1/umbrel-tiny-printer/master/svarion-tiny-printer/icon.svg
description: >-
  First start: open TinyPrinter, copy the server URL and device token into the Android app on your
  Sunmi V2. Use the Umbrel LAN IP in the Android app if umbrel.local does not resolve.


  Telegram is optional. Configure TELEGRAM_BOT_TOKEN and ALLOWED_TELEGRAM_IDS in
  /data/tinyprinter.env, then restart the app. This file is inside the app's persistent data folder.


  TinyPrinter renders a daily edition, shopping lists, messages, and GIF frames as monochrome
  receipts for the built-in Sunmi printer. The browser status page shows queue counts and connection
  details; Umbrel login protects the page, while device API requests use their own Bearer token.
releaseNotes: >-
  Add a daily extra (Accadde oggi, word of the day, or quote) to the morning edition.

developer: Svarion
website: https://github.com/svarion1/TinyPrinter
dependencies: []
repo: https://github.com/svarion1/umbrel-tiny-printer
support: https://github.com/svarion1/TinyPrinter/issues

port: 3019
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: Svarion
submission: https://github.com/svarion1/TinyPrinter/tree/feat/umbrel-packaging/umbrel/svarion-tiny-printer
